name: Run Tests

on: [push, pull_request]

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
        - uses: actions/checkout@v4
        - uses: astral-sh/setup-uv@v3
        - name: Install dependencies
          run: uv sync
          working-directory: calculator-server
        - name: Run tests
          run: uv run pytest test_main.py
          working-directory: calculator-server
